<!doctype html>
<html lang="es" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.remove("no-js");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F6F1" />
    <!--app-head-->
    <!-- Brand icons (Structural N) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Site-wide social defaults; title, description, URL and locale are generated per page -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nafureanu" />
    <meta property="og:image" content="https://nafureanu.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nafureanu — Software Engineering" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nafureanu.com/brand/og-image.png" />
    <!-- Typography: Inter and JetBrains Mono (Google Fonts), Satoshi (Fontshare).
         The font stylesheets load without blocking the first paint; metric-matched
         local fallbacks (src/index.css) hold the layout until the files arrive.
         Satoshi 700 sets every heading, so that one file is preloaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.fontshare.com/wf/LAFFD4SDUCDVQEXFPDC7C53EQ4ZELWQI/PXCT3G6LO6ICM5I3NTYENYPWJAECAWDD/GHM6WVH6MILNYOOCXHXB5GTSGNTMGXZR.woff2" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
